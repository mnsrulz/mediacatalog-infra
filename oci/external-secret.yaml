apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sync-oci-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: AMQP_URI
      remoteRef:
        key: cloudamqp-secret
    - secretKey: HF_TOKEN
      remoteRef:
        key: hf-token
    - secretKey: HF_BUCKET
      remoteRef:
        key: hf-bucket
    - secretKey: SEAWEED_ACCESS_KEY_ID
      remoteRef:
        key: seaweed-access-key-id
    - secretKey: SEAWEED_ACCESS_KEY
      remoteRef:
        key: seaweed-access-key