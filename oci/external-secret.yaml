apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: amqp-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: SecretStore
  target:
    name: amqp-credentials
    creationPolicy: Owner
  data:
    - secretKey: AMQP_URI
      remoteRef:
        key: cloudamqp-secret