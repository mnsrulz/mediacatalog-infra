apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-mzstorage
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: astral/uv:python3.12-bookworm-slim
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  
                  mkdir -p /data/w2-output /data/ohlc /data/static

                  uvx hf sync "${HF_BUCKET}/w2-output" /data/w2-output
                  uvx hf sync "${HF_BUCKET}/ohlc" /data/ohlc
                  uvx hf sync "${HF_BUCKET}/static" /data/static
                  echo "Sync completed!"
              env:
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: HF_TOKEN
                - name: HF_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: HF_BUCKET
              volumeMounts:
                - name: host-bucket
                  mountPath: /data
          volumes:
            - name: host-bucket
              hostPath:
                path: /opt/mz-hf-bucket
                type: Directory
