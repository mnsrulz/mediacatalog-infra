---
apiVersion: v1
kind: Service
metadata:
  name: resume
spec:
  ports:
    - name: reactiveresumeport
      port: 3000
      targetPort: resume-http
  selector:
    app: reactiveresume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactiveresume
spec:
  selector:
    matchLabels:
      app: reactiveresume
  replicas: 1
  template:
    metadata:
      labels:
        app: reactiveresume
    spec:
      nodeSelector:
        disktype: MEM
      containers:
        - name: reactiveresume
          image: ghcr.io/amruthpillai/reactive-resume:v5.2.4
          ports:
            - name: resume-http
              containerPort: 3000
          env:
            - name: APP_URL
              value: https://resume.local
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: reactiveresume-secrets
                  key: AUTH_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reactiveresume-secrets
                  key: DATABASE_URL
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweed-secret
                  key: SEAWEED_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweed-secret
                  key: SEAWEED_ACCESS_KEY
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: S3_REGION
              value: us-east-1
            - name: S3_ENDPOINT
              value: http://seaweedfs:8333
            - name: S3_BUCKET
              value: reactive-resume
